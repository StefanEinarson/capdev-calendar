<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breeding for Tomorrow | Capacity Development Opportunities 2026</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: rgba(255,255,255,0.78);
      --text: #1f2d2b;
      --muted: #60706d;
      --line: rgba(31,45,43,0.10);
      --green-deep: #2f8927;
      --green: #009933;
      --blue-deep: #003580;
      --earth: #cc3333;
      --gold: #f6b833;
      --sky: #0088c6;
      --purple: #993399;
      --shadow: 0 20px 50px rgba(19, 34, 29, 0.10);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --max: 1320px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(0,136,198,0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(47,137,39,0.14), transparent 26%),
        linear-gradient(180deg, #f7f5ef 0%, #f2efe8 100%);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .shell {
      max-width: var(--max);
      margin: 0 auto;
      padding: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: static;
      padding: 18px;
    }

    .filter-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .filter-heading .section-title { margin-bottom: 3px; }
    .filter-heading .helper { margin: 0; }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) repeat(3, minmax(150px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .filter-grid .control { margin: 0; min-width: 0; }

    .filter-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
    }

    .quarter-control { flex: 1 1 auto; min-width: 0; }

    .quarter-control > label { margin-bottom: 7px; }

    .section-title {
      margin: 0 0 14px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .helper {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .control { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.92);
      color: var(--text);
      font-size: 0.96rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: rgba(0,136,198,0.45);
      box-shadow: 0 0 0 4px rgba(0,136,198,0.10);
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-check {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 14px;
      padding: 12px 13px;
      background: rgba(255,255,255,0.75);
      border: 1px solid var(--line);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .chip-check input { margin: 0; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--blue-deep), var(--sky));
      box-shadow: 0 10px 20px rgba(0,53,128,0.18);
    }

    .btn-secondary {
      color: var(--text);
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
    }

    .content {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .toolbar {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .month-title {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .subdued {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .month-section {
      padding: 0 20px 22px;
    }

    .month-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
      flex-wrap: wrap;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr));
      gap: 16px;
    }

    .event-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.88));
      border: 1px solid rgba(31,45,43,0.08);
      box-shadow: 0 18px 34px rgba(23,34,30,0.08);
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .event-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 7px;
      background: var(--sky);
    }

    .event-card.trial::before { background: var(--green); }
    .event-card.lab::before { background: var(--purple); }
    .event-card.data::before { background: var(--sky); }
    .event-card.seed::before { background: var(--gold); }
    .event-card.cross::before { background: var(--earth); }

    .event-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: start;
    }

    .date-box {
      min-width: 84px;
      padding: 12px 10px;
      border-radius: 18px;
      text-align: center;
      background: #f5f8fb;
      border: 1px solid rgba(0,53,128,0.08);
    }

    .date-box .mon {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .date-box .day {
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 900;
      margin: 6px 0;
    }

    .date-box .end {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
    }

    .event-title {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text);
      background: #f3f6f8;
      border: 1px solid rgba(31,45,43,0.08);
    }

    .badge.area { background: rgba(47,137,39,0.10); }
    .badge.region { background: rgba(0,136,198,0.10); }
    .badge.mode { background: rgba(153,51,153,0.10); }
    .badge.quarter { background: rgba(246,184,51,0.16); }

    .meta-list {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .meta-list strong { color: var(--text); }

    .desc {
      margin: 0;
      color: #42524f;
      font-size: 0.95rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0,53,128,0.08);
      color: var(--blue-deep);
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
    }

    .empty-state {
      margin: 0 20px 20px;
      padding: 34px 24px;
      text-align: center;
      border-radius: 24px;
      border: 1px dashed rgba(31,45,43,0.16);
      color: var(--muted);
      background: rgba(255,255,255,0.58);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 27, 24, 0.42);
      z-index: 1000;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(760px, 100%);
      border-radius: 28px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(12,22,20,0.25);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    .modal h3 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.15;
    }

    .close-btn {
      background: #f3f6f8;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .muted-block {
      color: var(--muted);
      font-size: 0.96rem;
    }

    @media (max-width: 1160px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .month-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .shell { padding: 12px; }
      .filter-grid { grid-template-columns: 1fr; }
      .filter-footer { align-items: stretch; flex-direction: column; }
      .toolbar { padding-left: 16px; padding-right: 16px; }
      .month-section { padding: 0 16px 18px; }
      .toolbar { padding-top: 16px; }
      .toolbar-left { align-items: flex-start; }
      .month-title { font-size: 1.25rem; }
      .event-card { border-radius: 18px; padding: 16px; }
      .event-head { gap: 10px; }
      .date-box { min-width: 70px; padding: 10px 8px; }
      .date-box .day { font-size: 1.4rem; }
      .modal-backdrop { padding: 10px; }
      .modal { max-height: calc(100dvh - 20px); overflow-y: auto; border-radius: 20px; padding: 18px; }
      .modal-info-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .shell { padding: 8px; }
      .sidebar { padding: 14px; border-radius: 20px; }
      .filter-heading { display: block; }
      .filter-heading .btn-secondary { margin-top: 10px; width: 100%; }
      .chip-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .chip-check { justify-content: center; gap: 5px; padding: 10px 4px; font-size: 0.86rem; }
      .toolbar { display: block; }
      .toolbar-right { margin-top: 6px; }
      .month-section { padding-left: 10px; padding-right: 10px; }
      .event-head { flex-direction: column-reverse; }
      .date-box { display: flex; align-items: baseline; gap: 5px; width: fit-content; min-width: 0; padding: 6px 10px; }
      .date-box .day { margin: 0; font-size: 1rem; }
      .date-box .end { font-size: 0.78rem; }
      .badge { padding: 6px 8px; }
      .card-footer { align-items: stretch; }
      .pill-link { justify-content: center; width: 100%; }
    }
  
    .modal-reg-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0 6px;
      flex-wrap: wrap;
    }
    .reg-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .reg-badge.open   { background: #d4edda; color: #155724; }
    .reg-badge.closed { background: #f8d7da; color: #721c24; }
    .reg-badge.pending { background: #fff3cd; color: #765800; }
    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      margin-top: 12px;
    }
    .modal-info-item {
      background: var(--surface);
      border: 1px solid rgba(31,45,43,0.08);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .modal-info-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal-info-value {
      font-size: 0.95rem;
      color: var(--text);
    }
    .modal-info-value a {
      color: var(--green);
      text-decoration: none;
    }
    .modal-info-value a:hover { text-decoration: underline; }
</style>
</head>

    <div class="layout">
      <section class="panel sidebar" aria-labelledby="filterTitle">
        <div class="filter-heading">
          <div>
            <h1 class="section-title" id="filterTitle">Refine the calendar</h1>

          </div>
          <button class="btn-secondary" id="resetBtn" type="button">Reset filters</button>
        </div>

        <div class="filter-grid">

            <input id="searchInput" type="text" placeholder="Topic, audience, or location" autocomplete="off" />

          <div class="control">
            <label for="groupSelect">Group / area</label>
            <select id="groupSelect"><option value="all">All groups</option></select>
          </div>

          <div class="control">
            <label for="regionSelect">Region</label>
            <select id="regionSelect"><option value="all">All regions</option></select>
          </div>

          <div class="control">
            <label for="deliverySelect">Delivery mode</label>

              <option value="In Person">In person</option>
              <option value="Virtual">Virtual</option>
              <option value="Hybrid">Hybrid</option>
              <option value="To be confirmed">To be confirmed</option>
            </select>
          </div>
        </div>

        <div class="filter-footer">
          <div class="quarter-control">
            <label>Quarter</label>

          </div>
        </div>
      </section>

      <main class="content">
        <section class="panel">
          <div class="toolbar">
            <div class="toolbar-left">
              <div>
                <div class="month-title" id="yearLabel">2026 Training Opportunities</div>

            </div>
            <div class="toolbar-right subdued" id="yearMeta">0 opportunities visible across the year</div>
          </div>
          <div id="eventsMount"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-top">
        <div>

          <div class="badge-row" id="modalBadges" style="margin-top:10px;"></div>
        </div>
        <button class="close-btn" id="modalClose">Close</button>
      </div>
      <div class="muted-block" id="modalMeta"></div>
      <div class="modal-reg-row">
        <span id="modalRegBadge" class="reg-badge"></span>
      </div>
      <p id="modalDesc"></p>
      <div class="muted-block" id="modalAudience"></div>
      <div class="modal-info-grid" id="modalInfoGrid">
        <div class="modal-info-item">
          <div class="modal-info-label">How to Register</div>
          <div class="modal-info-value" id="modalHowToReg"></div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-label">Point of Contact</div>
          <div class="modal-info-value" id="modalContact"></div>
        </div>
        <div class="modal-info-item">
          <div class="modal-info-label">Resources</div>
          <div class="modal-info-value" id="modalResources"></div>
        </div>
      </div>
    </div>
  </div>

      { id:12, title:'RSN Q4 Session (tentative)', date:'2026-10-01', endDate:'2026-10-01', dateLabel:'October 2026 · Date to be confirmed', group:'RSN Session', region:'Global', location:'To be confirmed', format:'To be confirmed', quarter:'Q4', categoryClass:'data', audience:'Regional Support Network members', description:'The tentative fourth-quarter Regional Support Network session.', registration:'To be confirmed', howToRegister:'Participation details to be confirmed.', contact:'Rica, Mijail, Simba, and Michael', contactEmail:'', resource:'' },
      { id:13, title:'PLACEHOLDER', date:'2026-11-09', endDate:'2026-11-20', group:'Train-the-Trainer', region:'Global', location:'To be confirmed', format:'To be confirmed', quarter:'Q4', categoryClass:'data', audience:'To be confirmed', description:'A November train-the-trainer session whose final title and details are still to be confirmed.', registration:'To be confirmed', howToRegister:'Registration details to be confirmed.', contact:'To be confirmed', contactEmail:'', resource:'' },
      { id:14, title:'Harvest Manager', date:'2026-11-24', endDate:'2026-11-24', group:'Webinar', region:'Global', location:'Virtual', format:'Virtual', quarter:'Q4', categoryClass:'data', audience:'EBS users, breeding teams, data managers, and support network members', description:'A public webinar covering Harvest Manager.', registration:'To be confirmed', howToRegister:'Registration details to be confirmed.', contact:'Rosemary, Kate, and Connie; facilitators: Mijail and Ruth', contactEmail:'', resource:'' }
    ];

    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const els = {
      searchInput: document.getElementById('searchInput'),
      groupSelect: document.getElementById('groupSelect'),
      regionSelect: document.getElementById('regionSelect'),
      deliverySelect: document.getElementById('deliverySelect'),
      quarterList: document.getElementById('quarterList'),
      eventsMount: document.getElementById('eventsMount'),
      yearMeta: document.getElementById('yearMeta'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalTitle: document.getElementById('modalTitle'),
      modalBadges: document.getElementById('modalBadges'),
      modalMeta: document.getElementById('modalMeta'),
      modalDesc: document.getElementById('modalDesc'),
      modalAudience: document.getElementById('modalAudience'),
      modalRegBadge: document.getElementById('modalRegBadge'),
      modalHowToReg: document.getElementById('modalHowToReg'),
      modalContact: document.getElementById('modalContact'),
      modalResources: document.getElementById('modalResources')
    };

    function parseDate(dateStr) {
      return new Date(dateStr + 'T00:00:00');
    }

    function formatDateRange(start, end, dateLabel) {
      if (dateLabel) return dateLabel;
      const s = parseDate(start);
      const e = parseDate(end || start);
      if (!end || start === end) return `${monthNames[s.getMonth()]} ${s.getDate()}, ${s.getFullYear()}`;
      if (s.getMonth() === e.getMonth()) return `${monthNames[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`;
      return `${monthNames[s.getMonth()]} ${s.getDate()} – ${monthNames[e.getMonth()]} ${e.getDate()}, ${s.getFullYear()}`;
    }

    function uniqueValues(key) {
      return [...new Set(trainingData.map(item => item[key]))].sort();
    }

    function populateControls() {
      uniqueValues('group').forEach(group => {
        const option = document.createElement('option');
        option.value = group;
        option.textContent = group;
        els.groupSelect.appendChild(option);
      });

      uniqueValues('region').forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        els.regionSelect.appendChild(option);
      });

      uniqueValues('quarter').forEach(q => {
        const item = document.createElement('label');
        item.className = 'chip-check';
        item.innerHTML = `<input type="checkbox" value="${q}" checked /> <span>${q}</span>`;
        els.quarterList.appendChild(item);
      });
    }

    function selectedQuarters() {
      return [...els.quarterList.querySelectorAll('input:checked')].map(el => el.value);
    }

    function getFilteredEvents() {
      const search = els.searchInput.value.trim().toLowerCase();
      const group = els.groupSelect.value;
      const region = els.regionSelect.value;
      const format = els.deliverySelect.value;
      const quarters = selectedQuarters();

      return trainingData.filter(event => {
        const haystack = [event.title, event.group, event.region, event.location, event.audience, event.description].join(' ').toLowerCase();
        return (!search || haystack.includes(search)) &&
          (group === 'all' || event.group === group) &&
          (region === 'all' || event.region === region) &&
          (format === 'all' || event.format === format) &&
          quarters.includes(event.quarter);
      }).sort((a,b) => a.date.localeCompare(b.date));
    }

    function updateVisibleCount(allVisible) {
      els.yearMeta.textContent = `${allVisible.length} training${allVisible.length === 1 ? '' : 's'} shown`;
    }

    function renderYear(events) {
      if (!events.length) {
        els.eventsMount.innerHTML = '<div class="empty-state">No training opportunities match your filters right now. Try broadening the filters.</div>';
        return;
      }

      const grouped = {};
      events.forEach(event => {
        const d = parseDate(event.date);
        const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2, '0')}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(event);
      });

      const sections = Object.keys(grouped).sort().map(key => {
        const [year, month] = key.split('-').map(Number);
        const cards = grouped[key].map(event => {
          const d = parseDate(event.date);
          const end = parseDate(event.endDate || event.date);
          return `
            <article class="event-card ${event.categoryClass}">
              <div class="event-head">
                <div>
                  <h3 class="event-title">${event.title}</h3>
                  <div class="badge-row" style="margin-top:10px;">
                    <span class="badge area">${event.group}</span>
                    <span class="badge region">${event.region}</span>
                    <span class="badge mode">${event.format}</span>
                    <span class="badge quarter">${event.quarter}</span>
                  </div>
                </div>
                <div class="date-box">
                  <div class="mon">${monthNames[d.getMonth()].slice(0,3)}</div>
                  <div class="day">${event.dateLabel ? 'TBD' : d.getDate()}</div>
                  <div class="end">${event.dateLabel ? '' : `to ${end.getDate()}`}</div>
                </div>
              </div>
              <div class="meta-list">
                <div><strong>Date:</strong> ${formatDateRange(event.date, event.endDate, event.dateLabel)}</div>
                <div><strong>Location:</strong> ${event.location}</div>
                <div><strong>Audience:</strong> ${event.audience}</div>
              </div>
              <p class="desc">${event.description}</p>
              <div class="card-footer">
                <div class="subdued">${event.registration}</div>
                <button class="pill-link" data-event-id="${event.id}">View details →</button>
              </div>
            </article>
          `;
        }).join('');

        return `
          <section class="month-section" id="month-${monthNames[month].toLowerCase()}">
            <div class="month-section-head">
              <h3 style="margin:0;font-size:1.15rem;font-weight:900;letter-spacing:-0.02em;">${monthNames[month]} ${year}</h3>
              <div class="subdued">${grouped[key].length} opportunit${grouped[key].length === 1 ? 'y' : 'ies'}</div>
            </div>
            <div class="month-grid">${cards}</div>
          </section>
        `;
      }).join('');

      els.eventsMount.innerHTML = sections;
      els.eventsMount.querySelectorAll('[data-event-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const event = trainingData.find(item => item.id === Number(btn.dataset.eventId));
          if (event) openModal(event);
        });
      });
    }

    function openModal(event) {
      els.modalTitle.textContent = event.title;
      els.modalBadges.innerHTML = `
        <span class="badge area">${event.group}</span>
        <span class="badge region">${event.region}</span>
        <span class="badge mode">${event.format}</span>
        <span class="badge quarter">${event.quarter}</span>
      `;
      els.modalMeta.innerHTML = `<strong>Date:</strong> ${formatDateRange(event.date, event.endDate, event.dateLabel)}<br><strong>Location:</strong> ${event.location}`;
      const regStatus = event.registration || 'To be confirmed';
      const regEl = document.getElementById('modalRegBadge');
      const regClass = regStatus === 'Open' ? 'open' : regStatus === 'Closed' ? 'closed' : 'pending';
      regEl.textContent = `● Registration ${regStatus}`;
      regEl.className = 'reg-badge ' + regClass;
      els.modalDesc.textContent = event.description;
      els.modalAudience.innerHTML = `<strong>Audience:</strong> ${event.audience}`;
      document.getElementById('modalHowToReg').textContent = event.howToRegister || '—';
      document.getElementById('modalContact').innerHTML = event.contactEmail
        ? `${event.contact}<br><a href="mailto:${event.contactEmail}">${event.contactEmail}</a>`
        : (event.contact || '—');
      document.getElementById('modalResources').innerHTML = event.resource
        ? `<a href="${event.resource}" target="_blank" rel="noopener noreferrer">Open training resource</a>`
        : 'To be added';
      els.modalBackdrop.classList.add('show');
    }

    function closeModal() {
      els.modalBackdrop.classList.remove('show');
    }

    function render() {
      const visible = getFilteredEvents();
      updateVisibleCount(visible);
      renderYear(visible);
    }

    function resetFilters() {
      els.searchInput.value = '';
      els.groupSelect.value = 'all';
      els.regionSelect.value = 'all';
      els.deliverySelect.value = 'all';
      els.quarterList.querySelectorAll('input').forEach(input => input.checked = true);
      render();
    }

    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    els.modalBackdrop.addEventListener('click', e => { if (e.target === els.modalBackdrop) closeModal(); });

    [els.searchInput, els.groupSelect, els.regionSelect, els.deliverySelect].forEach(el => {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    els.quarterList.addEventListener('change', render);

    populateControls();
    render();
  </script>
</body>
</html>
